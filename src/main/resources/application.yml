server:
  port: ${SIGNIN_PORT:8084}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CLOUD_SESSION
        http-only: true
        secure: ${SIGNIN_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: sigin
  datasource:
    url: jdbc:h2:file:${SIGNIN_DB_PATH:./data/signin};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: ${SIGNIN_DB_USERNAME:sa}
    password: ${SIGNIN_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

signin:
  allowed-origins: ${SIGNIN_ALLOWED_ORIGINS:http://localhost:5176,http://127.0.0.1:5176}
  credentials:
    encryption-key: ${SIGNIN_CREDENTIAL_ENCRYPTION_KEY:}
    temporary-ttl: 5m
  inner:
    gateway-access-key: ${SIGNIN_INNER_GATEWAY_ACCESS_KEY:}
    gateway-secret-key: ${SIGNIN_INNER_GATEWAY_SECRET_KEY:}
    signature-skew: 5m
  verification-code:
    ttl: 5m
    resend-interval: 60s
    max-attempts: 5
    expose-in-response: ${SIGNIN_VERIFICATION_CODE_EXPOSE:false}
    delivery-webhook: ${SIGNIN_VERIFICATION_CODE_WEBHOOK:}
    delivery-token: ${SIGNIN_VERIFICATION_CODE_TOKEN:}
