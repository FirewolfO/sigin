server:
  port: ${SIGNIN_PORT:8084}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CLOUD_SESSION
        http-only: true
        secure: ${SIGNIN_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: sigin
  datasource:
    url: jdbc:h2:file:${SIGNIN_DB_PATH:./data/signin};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: ${SIGNIN_DB_USERNAME:sa}
    password: ${SIGNIN_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

signin:
  allowed-origins: ${SIGNIN_ALLOWED_ORIGINS:http://localhost:5176,http://127.0.0.1:5176}
