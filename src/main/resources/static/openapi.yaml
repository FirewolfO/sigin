openapi: 3.1.0
info:
  title: Cloud Sign-in API
  version: 0.2.0
  description: Account authentication, profile management and user API credential lifecycle.
  license:
    name: Proprietary
    url: https://github.com/FirewolfO/sigin
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      operationId: initializeCsrf
      summary: Initialize the browser CSRF cookie
      security: []
      responses:
        '200':
          description: CSRF cookie initialized
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CsrfMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/register:
    post:
      operationId: register
      summary: Register an account and create a session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verification-codes:
    post:
      operationId: sendLoginVerificationCode
      summary: Send a login code to a bound email address or phone number
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendVerificationCodeRequest'
      responses:
        '202':
          description: The request was accepted regardless of whether the account exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerificationCodeIssue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/code-login:
    post:
      operationId: loginWithVerificationCode
      summary: Log in with a single-use email or phone verification code
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCodeLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current session user
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Session invalidated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [loggedOut]
                        properties:
                          loggedOut:
                            type: boolean
                            const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /account/profile:
    put:
      operationId: updateProfile
      summary: Update the current account profile
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /account/api-credentials:
    get:
      operationId: listApiCredentials
      summary: List the current account API credentials
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Credential list with masked secret keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createApiCredential
      summary: Create an API credential and return its secret once
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiCredentialRequest'
      responses:
        '200':
          description: Created credential including its one-time plaintext secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ApiCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /account/api-credentials/{id}:
    delete:
      operationId: deleteApiCredential
      summary: Delete one API credential owned by the current account
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Credential not found
  /inner/credentials/resolve:
    post:
      operationId: resolveApiCredential
      summary: Resolve an enabled account API credential for Gateway verification
      security:
        - gatewayCredential: []
          gatewaySignature: []
          gatewayTimestamp: []
          gatewayNonce: []
          gatewayPayloadHash: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessKey]
              properties:
                accessKey:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: Resolved credential for the trusted Gateway only
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssuedCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /inner/credentials/exchange:
    post:
      operationId: exchangeSessionCredential
      summary: Exchange a browser session for a short-lived credential
      security:
        - sessionCookie: []
          gatewayCredential: []
          gatewaySignature: []
          gatewayTimestamp: []
          gatewayNonce: []
          gatewayPayloadHash: []
      responses:
        '200':
          description: Short-lived credential for Gateway request signing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssuedCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CLOUD_SESSION
    gatewayCredential:
      type: apiKey
      in: header
      name: X-Gateway-Credential
    gatewaySignature:
      type: apiKey
      in: header
      name: X-Gateway-Signature
    gatewayTimestamp:
      type: apiKey
      in: header
      name: X-Gateway-Timestamp
    gatewayNonce:
      type: apiKey
      in: header
      name: X-Gateway-Nonce
    gatewayPayloadHash:
      type: apiKey
      in: header
      name: X-Gateway-Content-SHA256
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value from the XSRF-TOKEN cookie returned by /auth/csrf.
      schema:
        type: string
  schemas:
    Envelope:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        requestId:
          type: string
    CsrfMetadata:
      type: object
      required: [headerName, parameterName]
      properties:
        headerName:
          type: string
          const: X-XSRF-TOKEN
        parameterName:
          type: string
          const: _csrf
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{2,31}$'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        displayName:
          type: [string, 'null']
          maxLength: 64
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9]\d{7,14}$'
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          maxLength: 32
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{2,31}$'
        password:
          type: string
          format: password
          maxLength: 72
    VerificationChannel:
      type: string
      enum: [EMAIL, PHONE]
    SendVerificationCodeRequest:
      type: object
      required: [channel, identifier]
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        identifier:
          type: string
          maxLength: 254
          description: A bound email address or E.164 phone number.
    VerificationCodeLoginRequest:
      type: object
      required: [channel, identifier, code]
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        identifier:
          type: string
          maxLength: 254
        code:
          type: string
          pattern: '^\d{6}$'
    VerificationCodeIssue:
      type: object
      required: [expiresInSeconds, retryAfterSeconds]
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          example: 300
        retryAfterSeconds:
          type: integer
          format: int64
          example: 60
        developmentCode:
          type: [string, 'null']
          pattern: '^\d{6}$'
          description: Present only when the explicit local-development exposure switch is enabled.
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9]\d{7,14}$'
        avatarUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000
    CreateApiCredentialRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    ApiCredential:
      type: object
      required: [id, name, accessKey, secretKey, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accessKey:
          type: string
        secretKey:
          type: string
          description: Plaintext only in the create response; masked in list responses.
        createdAt:
          type: string
          format: date-time
    IssuedCredential:
      type: object
      required: [accountId, accessKey, secretKey]
      properties:
        accountId:
          type: string
          format: uuid
        accessKey:
          type: string
        secretKey:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
    User:
      type: object
      required: [id, username, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: 'null'
  responses:
    UserResponse:
      description: User response
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing session or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing or invalid CSRF token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Username, email or phone is already in use
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Verification code delivery is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
