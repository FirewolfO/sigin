spring:
  datasource:
    url: jdbc:h2:mem:signin-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

signin:
  allowed-origins: http://localhost:5176
  credentials:
    encryption-key: 0123456789abcdef0123456789abcdef
    temporary-ttl: 5m
  inner:
    gateway-access-key: gwak_gateway_test
    gateway-secret-key: 0123456789abcdef0123456789abcdef
    signature-skew: 5m
  verification-code:
    expose-in-response: true
